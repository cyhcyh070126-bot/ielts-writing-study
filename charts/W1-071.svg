<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="20" y="35" font-size="24" text-anchor="start" fill="#dfdfd4">Solar-powered production of drinking water</text><text x="20" y="65" font-size="17" text-anchor="start" fill="#a9b8c2">Follow the separate electricity connection and water route</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dfdfd4"/></marker></defs><rect x="35" y="110" width="260" height="65" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="165.0" y="148.5" font-size="22" text-anchor="middle" fill="#dfdfd4">Sunlight</text><path d="M165 175L165 215" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="35" y="215" width="260" height="80" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="165.0" y="261.0" font-size="22" text-anchor="middle" fill="#dfdfd4">Solar panel</text><path d="M165 295L165 335" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="35" y="335" width="260" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="165.0" y="378.5" font-size="22" text-anchor="middle" fill="#dfdfd4">Converter</text><path d="M165 410V715H465" fill="none" stroke="#e6b98d" stroke-width="3" marker-end="url(#arr)"/><text x="190" y="685" font-size="19" text-anchor="start" fill="#dfdfd4">Electricity</text><rect x="355" y="670" width="225" height="100" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="467.5" y="714.0" font-size="21" text-anchor="middle" fill="#dfdfd4">Pump in underground</text><text x="467.5" y="738.0" font-size="21" text-anchor="middle" fill="#dfdfd4">well</text><path d="M470 670V180H620" fill="none" stroke="#9fbadb" stroke-width="4" marker-end="url(#arr)"/><text x="490" y="300" font-size="20" text-anchor="start" fill="#dfdfd4">Water</text><rect x="620" y="120" width="325" height="280" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="782.5" y="266.0" font-size="23" text-anchor="middle" fill="#dfdfd4">Water tank</text><text x="790" y="430" font-size="20" text-anchor="middle" fill="#dfdfd4">Wooden platform</text><path d="M640 405H930M670 405V560M900 405V560" stroke="#e6b98d" stroke-width="6" fill="none"/><rect x="800" y="300" width="125" height="70" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="862.5" y="329.0" font-size="19" text-anchor="middle" fill="#dfdfd4">Water</text><text x="862.5" y="353.0" font-size="19" text-anchor="middle" fill="#dfdfd4">filter</text><path d="M925 335L970 335" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><path d="M970 335V525" stroke="#9fbadb" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="940" y="480" font-size="20" text-anchor="end" fill="#dfdfd4">Tap</text><rect x="755" y="550" width="220" height="90" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="865.0" y="601.0" font-size="20" text-anchor="middle" fill="#dfdfd4">Moveable container</text><text x="690" y="510" font-size="20" text-anchor="start" fill="#dfdfd4">Drinking water</text></svg>