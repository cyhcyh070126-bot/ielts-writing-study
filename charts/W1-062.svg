<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1105" viewBox="0 0 1000 1105" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="22" y="32" font-size="23" text-anchor="start" fill="#dfdfd4">Ceramic pot manufacture</text><text x="22" y="60" font-size="15" text-anchor="start" fill="#a9b8c2">Independent schematic; follow arrows, not physical distance</text><rect x="55" y="70" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="98" font-size="19" text-anchor="start" fill="#dfdfd4">1. Dig raw materials from the ground</text><path d="M470 138v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="163" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="191" font-size="19" text-anchor="start" fill="#dfdfd4">2. Transport raw materials by truck to the factory</text><path d="M470 231v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="256" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="284" font-size="19" text-anchor="start" fill="#dfdfd4">3. Crush the materials</text><path d="M470 324v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="349" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="377" font-size="19" text-anchor="start" fill="#dfdfd4">4. Mix the crushed material</text><path d="M470 417v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="442" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="470" font-size="19" text-anchor="start" fill="#dfdfd4">5. Put the mixture into moulds</text><path d="M470 510v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="535" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="563" font-size="19" text-anchor="start" fill="#dfdfd4">6. Dry for 4-6 hours</text><path d="M470 603v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="628" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="656" font-size="19" text-anchor="start" fill="#dfdfd4">7. Remove / assemble clay pots</text><path d="M470 696v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="721" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="749" font-size="19" text-anchor="start" fill="#dfdfd4">8. Fire in an oven at 1,000°C</text><path d="M470 789v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="814" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="842" font-size="19" text-anchor="start" fill="#dfdfd4">9. Add colour</text><path d="M470 882v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="907" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="935" font-size="19" text-anchor="start" fill="#dfdfd4">10. Colour firing</text><path d="M470 975v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="1000" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="1028" font-size="19" text-anchor="start" fill="#dfdfd4">11. Finished pots</text></svg>