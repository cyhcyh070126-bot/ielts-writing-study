<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="24" y="35" font-size="24" text-anchor="start" fill="#dfdfd4">Simple water filter: components and water route</text><text x="24" y="65" font-size="17" text-anchor="start" fill="#a9b8c2">Schematic arrangement; no quantities or dimensions provided</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dfdfd4"/></marker></defs><rect x="80" y="115" width="320" height="65" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="240.0" y="153.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Impure water poured from above</text><path d="M240 180L240 225" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="80" y="225" width="320" height="300" rx="12" fill="#23313a" stroke="#a8c8bc"/><text x="95" y="250" font-size="19" text-anchor="start" fill="#dfdfd4">Barrel with lid</text><rect x="100" y="290" width="280" height="65" fill="#8c967f"/><text x="240" y="330" font-size="20" text-anchor="middle" fill="#dfdfd4">Sand</text><rect x="100" y="355" width="280" height="65" fill="#414b50"/><text x="240" y="395" font-size="20" text-anchor="middle" fill="#dfdfd4">Charcoal</text><rect x="100" y="420" width="280" height="65" fill="#7b8a8e"/><text x="240" y="460" font-size="20" text-anchor="middle" fill="#dfdfd4">Gravel</text><path d="M240 515H350V275H450V515H600" fill="none" stroke="#e6b98d" stroke-width="4" marker-end="url(#arr)"/><text x="470" y="320" font-size="19" text-anchor="start" fill="#dfdfd4">Hose / pipe</text><rect x="610" y="390" width="310" height="190" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="765.0" y="479.0" font-size="22" text-anchor="middle" fill="#dfdfd4">Drinking-water storage</text><text x="765.0" y="503.0" font-size="22" text-anchor="middle" fill="#dfdfd4">tank</text><path d="M920 540L960 540" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="938" y="580" font-size="19" text-anchor="middle" fill="#dfdfd4">Tap</text><text x="24" y="650" font-size="18" text-anchor="start" fill="#dfdfd4">Water passes down through sand, charcoal and gravel, then via the pipe to storage.</text></svg>