<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="458" viewBox="0 0 1000 458" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="22" y="32" font-size="23" text-anchor="start" fill="#dfdfd4">Salmon life cycle</text><text x="22" y="60" font-size="15" text-anchor="start" fill="#a9b8c2">Independent schematic; follow arrows, not physical distance</text><rect x="55" y="70" width="830" height="72" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="98" font-size="19" text-anchor="start" fill="#dfdfd4">1. Eggs among reeds and small stones in the slow upper river: about 5-6</text><text x="74" y="123" font-size="19" text-anchor="start" fill="#dfdfd4">months</text><path d="M470 142v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="167" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="195" font-size="19" text-anchor="start" fill="#dfdfd4">2. Fry, 3-8 cm, move to the fast-flowing lower river: about 4 years</text><path d="M470 235v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="260" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="288" font-size="19" text-anchor="start" fill="#dfdfd4">3. Smolt, 12-15 cm, migrate to the open sea: about 5 years</text><path d="M470 328v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="353" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="381" font-size="19" text-anchor="start" fill="#dfdfd4">4. Adult salmon, 70-76 cm, return upstream to reproduce</text><path d="M885 391H935V104H885m10 -6l-10 6 10 6" fill="none" stroke="#e6b98d" stroke-width="3"/><text x="932" y="223.0" font-size="17" text-anchor="end" fill="#dfdfd4">Return</text></svg>