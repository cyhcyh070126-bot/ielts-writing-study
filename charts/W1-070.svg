<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="20" y="35" font-size="24" text-anchor="start" fill="#dfdfd4">Solar panel structure and two heating applications</text><text x="20" y="65" font-size="17" text-anchor="start" fill="#a9b8c2">Independent schematic: heat from sunlight, not photovoltaic electricity</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dfdfd4"/></marker></defs><rect x="210" y="140" width="580" height="140" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="500.0" y="216.0" font-size="24" text-anchor="middle" fill="#dfdfd4">Box</text><rect x="240" y="100" width="520" height="70" fill="#344c57" fill-opacity="0.8" stroke="#9fbadb" stroke-dasharray="7 5"/><text x="500" y="138" font-size="21" text-anchor="middle" fill="#dfdfd4">Transparent glass cover</text><path d="M80 205L210 205" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="90" y="180" font-size="19" text-anchor="start" fill="#dfdfd4">Inlet</text><path d="M790 205L920 205" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="825" y="180" font-size="19" text-anchor="start" fill="#dfdfd4">Outlet</text><text x="20" y="345" font-size="23" text-anchor="start" fill="#dfdfd4">Application 1: warming air</text><rect x="220" y="415" width="560" height="140" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="500.0" y="491.0" font-size="23" text-anchor="middle" fill="#dfdfd4">Air warmed beneath transparent glass</text><path d="M60 485L220 485" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="65" y="460" font-size="19" text-anchor="start" fill="#dfdfd4">Air in</text><path d="M780 485L940 485" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="800" y="460" font-size="19" text-anchor="start" fill="#dfdfd4">Warm air out</text><path d="M400 365L470 415" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><path d="M540 365L610 415" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="355" font-size="18" text-anchor="start" fill="#dfdfd4">Sun rays</text><text x="20" y="640" font-size="23" text-anchor="start" fill="#dfdfd4">Application 2: warming water</text><rect x="220" y="710" width="560" height="170" rx="5" fill="#26343c" stroke="#a8c8bc"/><path d="M220 760 H660 Q705 760 705 795 Q705 830 660 830 H340 Q295 830 295 855 Q295 875 340 875 H780" fill="none" stroke="#e6b98d" stroke-width="6"/><path d="M60 760L220 760" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="735" font-size="19" text-anchor="start" fill="#dfdfd4">Water in</text><path d="M780 875L945 875" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="790" y="915" font-size="19" text-anchor="start" fill="#dfdfd4">Warm water out</text><text x="500" y="815" font-size="20" text-anchor="middle" fill="#dfdfd4">Winding water tube</text><path d="M400 665L470 710" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><path d="M540 665L610 710" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="430" y="655" font-size="18" text-anchor="start" fill="#dfdfd4">Sun rays</text></svg>