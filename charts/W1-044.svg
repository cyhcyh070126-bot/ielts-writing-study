<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="547" viewBox="0 0 1000 547" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="22" y="32" font-size="23" text-anchor="start" fill="#dfdfd4">Geothermal electricity: five main stages</text><text x="22" y="60" font-size="15" text-anchor="start" fill="#a9b8c2">Independent schematic; follow arrows, not physical distance</text><rect x="55" y="70" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="98" font-size="19" text-anchor="start" fill="#dfdfd4">1. Cold water is pumped down an injection well, 4.5 km underground</text><path d="M470 138v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="163" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="191" font-size="19" text-anchor="start" fill="#dfdfd4">2. Water passes through the geothermal zone of hot rocks</text><path d="M470 231v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="256" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="284" font-size="19" text-anchor="start" fill="#dfdfd4">3. Heated water is pumped up a production well</text><path d="M470 324v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="349" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="377" font-size="19" text-anchor="start" fill="#dfdfd4">4. At the surface, the unit labelled condenser produces steam</text><path d="M470 417v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="442" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="470" font-size="19" text-anchor="start" fill="#dfdfd4">5. Steam drives a turbine and generator; electricity goes to the grid</text></svg>