<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="648" viewBox="0 0 1000 648" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="22" y="32" font-size="23" text-anchor="start" fill="#dfdfd4">Hydroelectric power: day and night</text><text x="22" y="60" font-size="15" text-anchor="start" fill="#a9b8c2">Independent schematic; follow arrows, not physical distance</text><rect x="55" y="70" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="98" font-size="19" text-anchor="start" fill="#dfdfd4">1. DAY: River water is stored in a high-level reservoir behind a dam</text><path d="M470 138v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="163" width="830" height="72" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="191" font-size="19" text-anchor="start" fill="#dfdfd4">2. DAY: An open intake allows water to flow downhill to reversible</text><text x="74" y="216" font-size="19" text-anchor="start" fill="#dfdfd4">turbines</text><path d="M470 235v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="260" width="830" height="72" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="288" font-size="19" text-anchor="start" fill="#dfdfd4">3. DAY: Turbines drive a generator; electricity enters the national</text><text x="74" y="313" font-size="19" text-anchor="start" fill="#dfdfd4">grid</text><path d="M470 332v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="357" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="385" font-size="19" text-anchor="start" fill="#dfdfd4">4. DAY: Used water enters the low-level reservoir</text><path d="M470 425v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="450" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="478" font-size="19" text-anchor="start" fill="#dfdfd4">5. NIGHT: The intake is closed and turbines pump water uphill</text><path d="M470 518v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="543" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="571" font-size="19" text-anchor="start" fill="#dfdfd4">6. NIGHT: Water returns to the high-level reservoir for reuse</text><path d="M885 581H935V104H885m10 -6l-10 6 10 6" fill="none" stroke="#e6b98d" stroke-width="3"/><text x="932" y="318.0" font-size="17" text-anchor="end" fill="#dfdfd4">Return</text></svg>