<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="919" viewBox="0 0 1000 919" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="22" y="32" font-size="23" text-anchor="start" fill="#dfdfd4">Bamboo to clothing</text><text x="22" y="60" font-size="15" text-anchor="start" fill="#a9b8c2">Independent schematic; follow arrows, not physical distance</text><rect x="55" y="70" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="98" font-size="19" text-anchor="start" fill="#dfdfd4">1. Plant bamboo in spring</text><path d="M470 138v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="163" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="191" font-size="19" text-anchor="start" fill="#dfdfd4">2. Harvest bamboo in autumn</text><path d="M470 231v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="256" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="284" font-size="19" text-anchor="start" fill="#dfdfd4">3. Cut stems into strips</text><path d="M470 324v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="349" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="377" font-size="19" text-anchor="start" fill="#dfdfd4">4. Crush strips to make liquid pulp</text><path d="M470 417v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="442" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="470" font-size="19" text-anchor="start" fill="#dfdfd4">5. Filter to separate long fibres</text><path d="M470 510v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="535" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="563" font-size="19" text-anchor="start" fill="#dfdfd4">6. Soften fibres using water and amine oxide</text><path d="M470 603v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="628" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="656" font-size="19" text-anchor="start" fill="#dfdfd4">7. Spin softened fibres into yarn</text><path d="M470 696v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="721" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="749" font-size="19" text-anchor="start" fill="#dfdfd4">8. Weave yarn into fabric</text><path d="M470 789v22m-5 -7l5 7 5 -7" fill="none" stroke="#dfdfd4" stroke-width="2"/><rect x="55" y="814" width="830" height="68" rx="5" fill="#253039" stroke="#a8c8bc"/><text x="74" y="842" font-size="19" text-anchor="start" fill="#dfdfd4">9. Make clothing such as T-shirts and socks</text></svg>