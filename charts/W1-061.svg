<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Arial"><rect width="100%" height="100%" fill="#171c21"/><text x="24" y="35" font-size="24" text-anchor="start" fill="#dfdfd4">Soft cheese: production stages and outputs</text><text x="24" y="65" font-size="17" text-anchor="start" fill="#a9b8c2">Independent schematic | temperatures and waiting times as shown</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dfdfd4"/></marker></defs><rect x="50" y="100" width="660" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="380.0" y="143.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Mix water and milk (mixing)</text><path d="M380 175L380 205" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="205" width="660" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="380.0" y="248.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Cool: 5°C, 2 hours (mixing)</text><path d="M380 280L380 310" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="310" width="660" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="380.0" y="353.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Ferment with added salt: 35°C, 2 hours (heat)</text><path d="M380 385L380 415" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="415" width="660" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="380.0" y="458.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Evaporate: 100°C, 8 hours (heat)</text><path d="M380 490L380 520" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="520" width="660" height="75" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="380.0" y="563.5" font-size="19" text-anchor="middle" fill="#dfdfd4">Cool: 5°C, 8 hours; liquid thickens</text><path d="M710 450L770 450" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><text x="785" y="456" font-size="19" text-anchor="start" fill="#dfdfd4">Steam</text><path d="M710 545L770 545" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="780" y="510" width="190" height="60" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="875.0" y="534.0" font-size="17" text-anchor="middle" fill="#dfdfd4">Upper filter → soft</text><text x="875.0" y="558.0" font-size="17" text-anchor="middle" fill="#dfdfd4">cheese</text><path d="M380 595L380 635" fill="none" stroke="#dfdfd4" stroke-width="2" marker-end="url(#arr)"/><rect x="220" y="640" width="330" height="65" rx="5" fill="#26343c" stroke="#a8c8bc"/><text x="385.0" y="678.5" font-size="18" text-anchor="middle" fill="#dfdfd4">Lower filter → waste water</text></svg>